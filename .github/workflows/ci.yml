# CI for the omaconnect plugin.
#
# What CI can cover headless:
#   - the python unittest suite (tests/test_*.py): pure logic and script
#     source contracts
#   - the bash test suite (tests/*.test.sh): end-to-end script tests that
#     drive the real scripts with PATH-shimmed fake binaries, so nothing
#     touches the host
#   - shell syntax (bash -n) and shellcheck (when installed)
#
# What CI cannot cover: the Quickshell QML runtime. The plugin UI needs a
# running compositor/display, the omarchy-shell (Quickshell) engine and a
# KDE Connect daemon, none of which exist on a headless runner. The QML
# files therefore get a qmllint syntax check only — and even that is
# optional: every tool is availability-checked and its stage is skipped
# with a message when the tool is missing, so a failed install can never
# fail the build.

name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Required test dependency, no continue-on-error: the base scripts'
      # gdbus dependency check must behave as on an Omarchy host, or the
      # validation-argument tests (expecting exit 64, not 127) fail red.
      - name: Install required test dependencies (gdbus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-bin

      # Optional tooling. If these cannot be installed, validate.sh
      # availability-checks each tool and skips its stage, and the
      # belt-and-braces steps below still run the tests. qml6-module-*
      # let qmllint resolve QtQuick/Controls/Layouts instead of drowning in
      # unresolved-import diagnostics.
      - name: Install optional tools (shellcheck, qmllint, QML modules)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq shellcheck qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates
          # qt6-declarative-dev-tools installs qmllint under /usr/lib/qt6/bin,
          # which is not on the default runner PATH; export it so validate.sh
          # can discover it (validate.sh also falls back to that path itself).
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      # The Omarchy shell QML (qs.Ui / qs.Commons types) so qmllint can
      # resolve the plugin's imports. Cloned, never executed — it only feeds
      # three -I import paths to qmllint. OMARCHY_SHELL_PATH (not
      # OMARCHY_PATH) so the optional plugin-validator stage is not armed by
      # accident. Branch pinned so lint imports do not drift with the
      # default branch.
      - name: Omarchy shell QML for import paths
        continue-on-error: true
        run: |
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy /tmp/omarchy
          echo "OMARCHY_SHELL_PATH=/tmp/omarchy/shell" >> "$GITHUB_ENV"

      - name: validate.sh (all stages)
        run: bash scripts/validate.sh

      # Belt-and-braces: run the two test conventions directly as well, so a
      # regression in validate.sh itself cannot hide test failures.
      - name: Python unit tests (direct)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Bash tests (direct)
        run: |
          status=0
          for t in tests/*.test.sh; do
            [ -e "$t" ] || continue
            bash "$t" || status=1
          done
          exit "$status"
